name: Pre-Deployment to Main Auto-Merge

# Trigger on push to pre-deployment branch
on:
  push:
    branches: [pre-deployment]

permissions: read-all

jobs:
  quality-gates:
    name: Quality Gates (Pre-Deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1: ESLint (0 errors enforced)
      - name: 🔍 Gate 1/6 - ESLint (0 errors)
        run: pnpm run lint

      # Gate 2: TypeScript (strict mode, 0 errors)
      - name: 🔍 Gate 2/6 - TypeScript (strict, 0 errors)
        run: pnpm exec tsc --noEmit

      # Gate 3: Unit Tests (814/814 passing)
      - name: 🔍 Gate 3/6 - Unit Tests (814/814 passing)
        run: pnpm test -- --run
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

      # Gate 4: Production Build
      - name: 🔍 Gate 4/6 - Production Build
        run: pnpm run build
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

      # Gate 5: Bundle Size
      - name: 🔍 Gate 5/6 - Bundle Size (within limits)
        run: pnpm run size

      # Store build for E2E tests
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            package.json
            playwright.config.ts
          retention-days: 1

  e2e-tests:
    name: E2E Tests (Gate 6/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality-gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Gate 6: E2E Tests (WCAG 2A compliance on 8 routes)
      - name: 🔍 Gate 6/6 - E2E Tests (8/8 routes WCAG 2A)
        run: pnpm run test:e2e
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  auto-merge-to-main:
    name: Auto-Merge to Main (Production)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [quality-gates, e2e-tests]
    if: success() # Only run if all quality gates pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge pre-deployment to main
        run: |
          git checkout main
          git merge --no-ff origin/pre-deployment -m "chore: auto-merge pre-deployment to main after quality gates

          All 6 quality gates passed:
          ✅ ESLint (0 errors)
          ✅ TypeScript (0 errors)
          ✅ Unit Tests (814/814 passing)
          ✅ Production Build (success)
          ✅ Bundle Size (within limits)
          ✅ E2E Tests (8/8 routes WCAG 2A)

          🤖 Auto-merged by GitHub Actions
          🚀 Deploying to production: https://omerakben.com/"

      - name: Push to main
        run: git push origin main

      - name: Create deployment tag
        run: |
          TAG_NAME="deploy-$(date +'%Y%m%d-%H%M%S')"
          git tag -a "$TAG_NAME" -m "Production deployment from pre-deployment

          All quality gates passed, auto-merged to main."
          git push origin "$TAG_NAME"

      - name: Notify success
        run: |
          echo "✅ All quality gates passed!"
          echo "✅ pre-deployment merged to main"
          echo "🚀 Production deployment triggered"
          echo "🔗 Site: https://omerakben.com/"
